<head>

<title>Plano de Ação CATI 2027–2030</title>
<style>
:root{--navy:#12395B;--blue:#2C6EAA;--green:#2F7D27;--ink:#1D2B36;--muted:#667784;--line:#D7E0E8;--bg:#F7F9FB;--soft:#EEF4F8;--gold:#C28A32;--violet:#6B5B95}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink);min-width:320px}
button,input,select{font:inherit}button{cursor:pointer}
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.985);border-bottom:1px solid var(--line);box-shadow:0 1px 8px rgba(18,57,91,.05)}
.header{max-width:1760px;margin:auto;padding:18px 28px 12px}.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
h1{margin:0;color:var(--navy);font-size:27px;letter-spacing:-.4px}.sub{margin-top:5px;color:var(--muted);font-size:12.5px;line-height:1.45}.note{margin-top:3px;font-size:10.5px;color:#7A8994}
.mobileFilters{display:none;background:white;border:1px solid var(--line);border-radius:8px;padding:9px 11px;color:var(--navy);font-weight:700}
.scope{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:12px}.scope span.label{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.pill{border:1px solid var(--line);background:white;border-radius:999px;padding:7px 10px;font-size:11px;font-weight:700;color:#405363}.pill b{background:#EFF3F6;border-radius:999px;padding:2px 5px;margin-left:4px;color:var(--navy)}
.pill.active{background:var(--navy);border-color:var(--navy);color:white}.pill.active b{background:rgba(255,255,255,.18);color:white}.pill[data-scope=cati]{border-color:#AACBB3}.pill[data-scope=cati].active{background:var(--green);border-color:var(--green)}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:11px;padding-top:11px;border-top:1px solid #EDF1F4}.toolbar input,.toolbar select,.toolbar button{min-height:37px;border:1px solid var(--line);border-radius:8px;background:white;padding:8px 9px;color:var(--ink)}
#search{flex:1;min-width:250px;max-width:430px}.view{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:white}.view button{border:0;border-radius:0;min-height:35px;font-size:11px}.view button+button{border-left:1px solid var(--line)}.view button.active{background:#E9F1F7;color:var(--navy);font-weight:800}
main{max-width:1760px;margin:auto;padding:18px 28px 46px}.kpis{display:grid;grid-template-columns:repeat(4,minmax(140px,1fr));gap:9px;margin-bottom:12px}.kpi{background:white;border:1px solid var(--line);border-radius:9px;padding:11px 13px}.kpi b{font-size:22px;color:var(--navy)}.kpi.cati b{color:var(--green)}.kpi span{display:block;margin-top:4px;font-size:10.8px;color:var(--muted)}
.summary{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:11px;margin:0 2px 9px}.summary strong{color:var(--navy)}
.sections{display:grid;grid-template-columns:repeat(auto-fit,minmax(355px,1fr));gap:14px;align-items:start}.section{background:#FBFCFD;border:1px solid var(--line);border-top:5px solid var(--blue);border-radius:10px;overflow:hidden}.section h2{font-size:14.5px;color:var(--navy);margin:0;padding:12px 12px 8px;display:flex;justify-content:space-between;gap:8px}.count{font-size:10.8px;color:var(--muted);font-weight:600;white-space:nowrap}.groups{padding:0 8px 9px;display:flex;flex-direction:column;gap:8px}

.empty,.loading,.fatal{background:white;border:1px solid var(--line);border-radius:10px;padding:18px;color:var(--muted)}.fatal{border-left:5px solid #B55448}
@media(max-width:720px){.header{padding:11px 12px 9px}h1{font-size:20px}.sub{font-size:11px}.mobileFilters{display:block}.toolbar{display:none;align-items:stretch}.toolbar.open{display:flex}.toolbar input,.toolbar select{width:100%;max-width:none}.view{width:100%}.view button{flex:1}.scope{overflow-x:auto;flex-wrap:nowrap}.scope .label{display:none!important}main{padding:10px 9px 36px}.kpis{grid-template-columns:repeat(2,1fr);gap:6px}.kpi{text-align:center;padding:8px}.kpi b{font-size:18px}.kpi span{font-size:9px}.sections{grid-template-columns:1fr;gap:10px}.summary{font-size:10px}.section h2{position:sticky;top:94px;background:white;z-index:2}}
@media print{header{position:static}.toolbar,.scope,.mobileFilters{display:none!important}.sections{grid-template-columns:1fr 1fr}.detail{display:block!important}.toggle{display:none}}
#specificObjectiveFilter{min-width:320px;max-width:470px}
#objectiveFilter{min-width:210px}
#impact{min-width:150px}
@media(max-width:720px){#specificObjectiveFilter,#objectiveFilter,#impact{min-width:0;max-width:none}}
</style>
</head>

<header><div class="header">

nais","Esforço Inovador — Tecnologia nacional — ampliar faturamento"],"catiInstruments":[]},{"id":"A51","uid":"linha-54","n":51,"action":"Compras Públicas: Requisitos, Desempenho e Neutralidade","origin":"WS1","description":"- Incorporar requisitos técnicos mensuráveis ao longo do ciclo de vida de conteúdo tecnológico nacional, cibersegurança (proteção de dados), manutenção/atualização e auditabilidade \n- Criar uma lista negativa/sistema de avaliação de empresas que tenham vencido licitações e posteriormente ofertado serviços de má qualidade \n- Considerar requisitos que hoje são exigidos localmente, mas não necessariamente são cumpridos por fornecedores que exportam para o Brasil, incluindo economia circular e determinados componentes tributários da mão de obra.\n- Reduzir a complexidade e burocracia dos processos e dos editais, aprimorar a neutralidade das especificações técnicas, evitando direcionamento a determinado produto ou fornecedor\n- Aprimorar o catálogo de materiais e serviços do Compras.gov.br e promover padronização \n- Apoiar as equipes de contratação com referências técnicas e catálogos de requisitos por família de produto, pois parte da perda de efetividade ocorre na própria redação do objeto. \n- Criar previamente versões de referência de anexos de engenharia, sem efeito normativo, testadas sobre dispêndios já declarados à Lei de TICs, para verificar o que é efetivamente auditável antes de transformar requisito em exigência.\n- Desenvolver uma taxonomia única de conteúdo tecnológico aplicável aos diferentes instrumentos, evitando múltiplas definições, custos de conformidade e permitindo comparação de resultados.","justification":"Analisar contribuições propostas para o Planejamento TICs","challenge":"A detalhar","lead":"MGI","participants":"MCTI; MGI; MS","nature":"Compras e Encomendas Tecnológicas","impact":"Alto","impactGroup":"Alto","maturity":"2 - Elaborar","start":"1S27","value":null,"source":null,"cati":false,"scope":"Agenda ampliada","layer const STRATEGIC_OBJECTIVES=[{value:"Esforço Inovador",label:"Ampliar esforço inovador"},{value:"Inserção Global",label:"Promover inserção global"},{value:"Tecnologias Estratégicas",label:"Tecnologias Estratégicas"},{value:"Empresas Estratégicas",label:"Fortalecer Empresas Estratégicas"},{value:"Aplicações Prioritárias",label:"Aplicações Prioritárias"}];
const OBJECTIVE_DISPLAY=Object.fromEntries(STRATEGIC_OBJECTIVES.map(x=>[x.value,x.label]));
const COLORS={"Esforço Inovador":"#2B8E9E","Inserção Global":"#C28A32","Tecnologias Estratégicas":"#6B5B95","Empresas Estratégicas":"#8C6D47","Aplicações Prioritárias":"#4F9B62"};
const IMPACT_ORDER=["Estruturante","Muito Alto","Alto","Médio","Baixo","Sem classificação"];
const IMPACT_COLORS={"Estruturante":"#173A5E","Muito Alto":"#2F7D27","Alto":"#2C6EAA","Médio":"#C28A32","Baixo":"#7D8892","Sem classificação":"#AAB4BC"};
let actions=INITIAL_DATA.actions,objOrder=INITIAL_DATA.objOrder,specificOptions=INITIAL_DATA.specificOptions,scope="all",view="impact";
const N=v=>String(v??"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim().toLowerCase().replace(/\s+/g," ");
const E=v=>String(v??"—").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const uniq=a=>[...new Set(a.filter(Boolean))].sort((x,y)=>String(x).localeCompare(String(y),"pt-BR"));
function fill(sel,vals){while(sel.options.length>1)sel.remove(1);uniq(vals).forEach(v=>{let o=document.createElement("option");o.value=v;o.textContent=v;sel.appendChild(o)})}
function fillPairs(sel,pairs){while(sel.options.length>1)sel.remove(1);const seen=new Set; pairs.forEach(p=>{if(!p||!p.value||seen.has(p.value))return;seen.add(p.value);let o=document.createElement("option");o.value=p.value;o.textContent=p.label||p.value;sel.appendChild(o)})}
function updateSpecificFilter(){const strategic=objectiveFilter.value;const available=new Set(actions.filter(a=>!strategic||a.layers.includes(strategic)).flatMap(a=>a.metrics));fillPairs(specificObjectiveFilter,specificOptions.filter(p=>available.has(p.raw||p.value)).map(p=>({value:p.raw||p.value,label:p.label})));specificObjectiveFilter.disabled=available.size===0}
function setup(){fill(impact,IMPACT_ORDER.filter(v=>actions.some(a=>a.impactGroup===v)));fillPairs(objectiveFilter,STRATEGIC_OBJECTIVES.filter(x=>objOrder.includes(x.value)));fill(maturity,actions.map(a=>a.maturity));fill(lead,actions.map(a=>a.lead));fill(natureFilter,actions.map(a=>a.nature));fill(catiInstrumentFilter,actions.flatMap(a=>a.catiInstruments));updateSpecificFilter();const c=actions.filter(a=>a.cati).length,s=actions.filter(a=>a.start).length;[kTotal,nAll].forEach(x=>x.textContent=actions.length);[kCati,nCati].forEach(x=>x.textContent=c);[kBroad,nBroad].forEach(x=>x.textContent=actions.length-c);kStart.textContent=s}
function relevanceRank(a){return {"estruturante":5,"muito alto":4,"alto":3,"medio":2,"baixo":1}[N(a.impactGroup||a.impact)]??0}
function sortByRelevance(arr){return [...arr].sort((a,b)=>relevanceRank(b)-relevanceRank(a)||a.n-b.n)}
function vis(){const q=search.value.trim().toLocaleLowerCase("pt-BR");return sortByRelevance(actions.filter(a=>{const hay=[a.action,a.description,a.justification,a.challenge,a.lead,a.participants,a.origin,a.nature,a.scope,...a.layers,...a.metrics,...a.metricLabels,...a.catiInstruments].filter(Boolean).join(" ").toLocaleLowerCase("pt-BR");return (scope==="all"||(scope==="cati"?a.cati:!a.cati))&&(!impact.value||a.impactGroup===impact.value)&&(!maturity.value||a.maturity===maturity.value)&&(!lead.value||a.lead===lead.value)&&(!objectiveFilter.value||a.layers.includes(objectiveFilter.value))&&(!specificObjectiveFilter.value||a.metrics.includes(specificObjectiveFilter.value))&&(!natureFilter.value||a.nature===natureFilter.value)&&(!catiInstrumentFilter.value||a.catiInstruments.includes(catiInstrumentFilter.value))&&(!q||hay.includes(q))}))}
function chips(a,cls=""){return a&&a.length?'<div class="chips">'+a.map(x=>'<span class="chip '+cls+'">'+E(x)+'</span>').join("")+'</div>':"—"}
function card(a){const ic=N(a.impactGroup)==="estruturante"?"struct":["alto","muito alto"].includes(N(a.impactGroup))?"high":"";return '<article class="card '+(a.cati?"cati":"")+'"><div class="ctop"><span class="id">'+E(a.id)+'</span><div class="title">'+E(a.action)+'</div><span class="scopeTag '+(a.cati?"cati":"")+'">'+(a.cati?"CATI":"Agenda ampliada")+'</span></div><div class="meta"><span class="tag '+ic+'">'+E(a.impactGroup||"—")+'</span><span class="tag">'+E(a.maturity||"—")+(a.start?" · "+E(a.start):"")+'</span><span class="tag">'+E(a.lead||"—")+'</span><span class="tag type">'+E(a.nature||"—")+'</span></div><div class="toggle"><span>Abrir detalhes</span><span>⌄</span></div><div class="detail"><div class="row"><b>Descrição.</b> '+E(a.description||"—")+'</div><div class="row"><b>Fundamentação.</b> '+E(a.justification||"—")+'</div><div class="row"><b>Desafio.</b> '+E(a.challenge||"—")+'</div><div class="row"><b>Participantes.</b> '+E(a.participants||"—")+'</div><div class="row"><b>Origem.</b> '+E(a.origin||"—")+'</div><div class="row"><b>Objetivos estratégicos associados.</b> '+chips(a.layers,"obj")+'</div><div class="row"><b>Objetivos específicos / resultados associados.</b> '+chips(a.metricLabels)+'</div><div class="row"><b>Instrumentos CATI.</b> '+chips(a.catiInstruments)+'</div></div></article>'}
function wire(){document.querySelectorAll(".toggle").forEach(t=>t.onclick=()=>{const c=t.closest(".card");c.classList.toggle("open");t.firstElementChild.textContent=c.classList.contains("open")?"Recolher detalhes":"Abrir detalhes"})}
function render(){sections.innerHTML="";const set=vis();visible.textContent=set.length;viewLabel.textContent=view==="impact"?"Organização por impacto":"Organização por objetivo estratégico";if(view==="impact"){IMPACT_ORDER.forEach(level=>{const arr=set.filter(a=>a.impactGroup===level);if(!arr.length)return;const s=document.createElement("section");s.className="section";s.style.borderTopColor=IMPACT_COLORS[level]||"#2C6EAA";s.innerHTML='<h2><span>'+E(level)+'</span><span class="count">'+arr.length+' '+(arr.length===1?"ação":"ações")+'</span></h2><div class="groups"></div>';const g=s.querySelector(".groups"),assigned=new Set;objOrder.forEach(o=>{const l=arr.filter(a=>a.layers.includes(o)&&!assigned.has(a.uid));if(!l.length)return;l.forEach(a=>assigned.add(a.uid));const d=document.createElement("div");d.className="group";d.innerHTML='<div class="ghead"><strong>'+E(OBJECTIVE_DISPLAY[o]||o)+'</strong><span>'+l.length+' '+(l.length===1?"ação":"ações")+'</span></div><div class="cards">'+sortByRelevance(l).map(card).join("")+'</div>';g.appendChild(d)});const other=arr.filter(a=>!assigned.has(a.uid));if(other.length){const d=document.createElement("div");d.className="group";d.innerHTML='<div class="ghead"><strong>Transversais / outros objetivos</strong><span>'+other.length+' '+(other.length===1?"ação":"ações")+'</span></div><div class="cards">'+sortByRelevance(other).map(card).join("")+'</div>';g.appendChild(d)}sections.appendChild(s)})}else{objOrder.forEach(o=>{const arr=set.filter(a=>a.layers.includes(o));const s=document.createElement("section");s.className="section";s.style.borderTopColor=COLORS[o]||"#2C6EAA";s.innerHTML='<h2><span>'+E(OBJECTIVE_DISPLAY[o]||o)+'</span><span class="count">'+arr.length+' '+(arr.length===1?"ação":"ações")+'</span></h2><div class="groups"></div>';const g=s.querySelector(".groups");if(!arr.length)g.innerHTML='<div class="empty">Nenhuma ação com os filtros atuais.</div>';else{const m=new Map;arr.forEach(a=>{if(!m.has(a.nature))m.set(a.nature,[]);m.get(a.nature).push(a)});[...m].sort((x,y)=>x[0].localeCompare(y[0],"pt-BR")).forEach(([k,l])=>{const d=document.createElement("div");d.className="group";d.innerHTML='<div class="ghead"><strong>'+E(k)+'</strong><span>'+l.length+' '+(l.length===1?"ação":"ações")+'</span></div><div class="cards">'+sortByRelevance(l).map(card).join("")+'</div>';g.appendChild(d)})}sections.appendChild(s)})}wire()}
document.querySelectorAll(".pill").forEach(b=>b.onclick=()=>{scope=b.dataset.scope;document.querySelectorAll(".pill").forEach(x=>x.classList.toggle("active",x===b));render()});let debounce;search.oninput=()=>{clearTimeout(debounce);debounce=setTimeout(render,120)};[impact,maturity,lead,specificObjectiveFilter,natureFilter,catiInstrumentFilter].forEach(x=>x.oninput=render);objectiveFilter.oninput=()=>{specificObjectiveFilter.value="";updateSpecificFilter();render()};byImpact.onclick=()=>{view="impact";byImpact.classList.add("active");byObjective.classList.remove("active");render()};byObjective.onclick=()=>{view="objective";byObjective.classList.add("active");byImpact.classList.remove("active");render()};clear.onclick=()=>{search.value=impact.value=maturity.value=lead.value=objectiveFilter.value=specificObjectiveFilter.value=natureFilter.value=catiInstrumentFilter.value="";scope="all";document.querySelectorAll(".pill").forEach(x=>x.classList.toggle("active",x.dataset.scope==="all"));updateSpecificFilter();render()};expand.onclick=()=>document.querySelectorAll(".card").forEach(c=>{c.classList.add("open");c.querySelector(".toggle span").textContent="Recolher detalhes"});collapse.onclick=()=>document.querySelectorAll(".card").forEach(c=>{c.classList.remove("open");c.querySelector(".toggle span").textContent="Abrir detalhes"});mobileFilters.onclick=()=>toolbar.classList.toggle("open");
setup();status.remove();app.hidden=false;baseNote.textContent="Base publicada · "+actions.length+" ações · carregamento imediato";render();
