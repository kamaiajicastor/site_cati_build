<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12395B">
<title>Plano de Ação CATI 2027–2030</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--navy:#12395B;--blue:#2C6EAA;--green:#2F7D27;--ink:#1D2B36;--muted:#667784;--line:#D7E0E8;--bg:#F7F9FB;--soft:#EEF4F8;--gold:#C28A32;--violet:#6B5B95}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink);min-width:320px}
button,input,select{font:inherit}button{cursor:pointer}
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.985);border-bottom:1px solid var(--line);box-shadow:0 1px 8px rgba(18,57,91,.05)}
.header{max-width:1760px;margin:auto;padding:18px 28px 12px}.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
h1{margin:0;color:var(--navy);font-size:27px;letter-spacing:-.4px}.sub{margin-top:5px;color:var(--muted);font-size:12.5px;line-height:1.45}.note{margin-top:3px;font-size:10.5px;color:#7A8994}
.mobileFilters{display:none;background:white;border:1px solid var(--line);border-radius:8px;padding:9px 11px;color:var(--navy);font-weight:700}
.scope{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:12px}.scope span.label{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.pill{border:1px solid var(--line);background:white;border-radius:999px;padding:7px 10px;font-size:11px;font-weight:700;color:#405363}.pill b{background:#EFF3F6;border-radius:999px;padding:2px 5px;margin-left:4px;color:var(--navy)}
.pill.active{background:var(--navy);border-color:var(--navy);color:white}.pill.active b{background:rgba(255,255,255,.18);color:white}.pill[data-scope=cati]{border-color:#AACBB3}.pill[data-scope=cati].active{background:var(--green);border-color:var(--green)}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:11px;padding-top:11px;border-top:1px solid #EDF1F4}.toolbar input,.toolbar select,.toolbar button{min-height:37px;border:1px solid var(--line);border-radius:8px;background:white;padding:8px 9px;color:var(--ink)}
#search{flex:1;min-width:250px;max-width:430px}.view{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:white}.view button{border:0;border-radius:0;min-height:35px;font-size:11px}.view button+button{border-left:1px solid var(--line)}.view button.active{background:#E9F1F7;color:var(--navy);font-weight:800}
main{max-width:1760px;margin:auto;padding:18px 28px 46px}.kpis{display:grid;grid-template-columns:repeat(4,minmax(140px,1fr));gap:9px;margin-bottom:12px}.kpi{background:white;border:1px solid var(--line);border-radius:9px;padding:11px 13px}.kpi b{font-size:22px;color:var(--navy)}.kpi.cati b{color:var(--green)}.kpi span{display:block;margin-top:4px;font-size:10.8px;color:var(--muted)}
.summary{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:11px;margin:0 2px 9px}.summary strong{color:var(--navy)}
.sections{display:grid;grid-template-columns:repeat(auto-fit,minmax(355px,1fr));gap:14px;align-items:start}.section{background:#FBFCFD;border:1px solid var(--line);border-top:5px solid var(--blue);border-radius:10px;overflow:hidden}.section h2{font-size:14.5px;color:var(--navy);margin:0;padding:12px 12px 8px;display:flex;justify-content:space-between;gap:8px}.count{font-size:10.8px;color:var(--muted);font-weight:600;white-space:nowrap}.groups{padding:0 8px 9px;display:flex;flex-direction:column;gap:8px}
.group{background:white;border:1px solid #E2E9EF;border-radius:8px;overflow:hidden}.ghead{background:#F4F7FA;border-bottom:1px solid #E5EBF0;padding:7px 8px;display:flex;justify-content:space-between;gap:8px}.ghead strong{font-size:11px;color:#31536E}.ghead span{font-size:9.7px;color:var(--muted)}
.cards{padding:6px;display:flex;flex-direction:column;gap:6px}.card{border:1px solid var(--line);border-radius:8px;padding:9px;background:white}.card.cati{border-left:4px solid var(--green)}.ctop{display:flex;align-items:flex-start;gap:7px}.id{background:var(--navy);color:white;border-radius:5px;padding:4px 5px;font-size:9.8px;font-weight:700;white-space:nowrap}.title{font-size:13px;color:#102F4B;font-weight:700;line-height:1.28;flex:1}.scopeTag{font-size:8.4px;font-weight:800;border-radius:999px;padding:4px 5px;white-space:nowrap;background:#F2F4F6;color:#596673}.scopeTag.cati{background:#E7F2EA;color:#28603A}
.meta{display:flex;gap:4px;flex-wrap:wrap;margin-top:7px}.tag{font-size:9px;border-radius:999px;padding:4px 6px;background:#EEF3F7;color:#455563}.tag.struct{background:#DCE9F5;color:#153F67;font-weight:700}.tag.high{background:#E9F3EC;color:#2D6A3D}.tag.type{background:#F6F0E5;color:#755B2B}
.toggle{border-top:1px solid #EDF1F4;margin-top:7px;padding-top:7px;display:flex;justify-content:space-between;font-size:10px;color:var(--navy);font-weight:700;cursor:pointer}.detail{display:none;border-top:1px solid #E4EAEF;margin-top:8px;padding-top:9px;font-size:11.5px;line-height:1.48;color:#344957}.card.open .detail{display:block}.row{white-space:pre-wrap;margin-bottom:9px;overflow-wrap:anywhere}.row b{color:var(--navy)}.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}.chip{font-size:9.5px;padding:3px 5px;background:#F1F5F8;border:1px solid #E0E8EE;border-radius:5px}.chip.obj{background:#EDF5FA;color:#24567D;border-color:#D7E8F3}
.empty,.loading,.fatal{background:white;border:1px solid var(--line);border-radius:10px;padding:18px;color:var(--muted)}.fatal{border-left:5px solid #B55448}
@media(max-width:720px){.header{padding:11px 12px 9px}h1{font-size:20px}.sub{font-size:11px}.mobileFilters{display:block}.toolbar{display:none;align-items:stretch}.toolbar.open{display:flex}.toolbar input,.toolbar select{width:100%;max-width:none}.view{width:100%}.view button{flex:1}.scope{overflow-x:auto;flex-wrap:nowrap}.scope .label{display:none!important}main{padding:10px 9px 36px}.kpis{grid-template-columns:repeat(2,1fr);gap:6px}.kpi{text-align:center;padding:8px}.kpi b{font-size:18px}.kpi span{font-size:9px}.sections{grid-template-columns:1fr;gap:10px}.summary{font-size:10px}.section h2{position:sticky;top:94px;background:white;z-index:2}}
@media print{header{position:static}.toolbar,.scope,.mobileFilters{display:none!important}.sections{grid-template-columns:1fr 1fr}.detail{display:block!important}.toggle{display:none}}
</style>
</head>
<body>
<header><div class="header">
  <div class="top"><div><h1>Plano de Ação CATI 2027–2030</h1><div id="baseNote" class="note">Carregando base...</div></div><button id="mobileFilters" class="mobileFilters">Filtros</button></div>
  <div class="scope">
    <span class="label">Escopo</span>
    <button class="pill active" data-scope="all">Todas <b id="nAll">—</b></button>
    <button class="pill" data-scope="cati">Vinculadas ao CATI <b id="nCati">—</b></button>
    <button class="pill" data-scope="broad">Agenda ampliada <b id="nBroad">—</b></button>
  </div>
  <div id="toolbar" class="toolbar">
    <input id="search" placeholder="Buscar ação, tema, líder, instrumento…">
    <select id="impact"><option value="">Impacto: todos</option></select>
    <select id="maturity"><option value="">Maturidade: todas</option></select>
    <select id="lead"><option value="">Líder: todos</option></select>
    <select id="objectiveFilter"><option value="">Objetivo específico: todos</option></select>
    <select id="kind"><option value="">Eixo: todos</option></select>
    <div class="view"><button id="byObjective" class="active">Por objetivo</button><button id="byKind">Por eixo</button></div>
    <button id="expand">Expandir visíveis</button><button id="collapse">Recolher</button><button id="clear">Limpar filtros</button>
  </div>
</div></header>
<main>
  <div id="status" class="loading">Carregando <strong>Plano_Acao.xlsx</strong>…</div>
  <div id="app" hidden>
    <div class="kpis">
      <div class="kpi"><b id="kTotal">0</b><span>ações no plano</span></div>
      <div class="kpi cati"><b id="kCati">0</b><span>ações vinculadas ao CATI</span></div>
      <div class="kpi"><b id="kBroad">0</b><span>ações da agenda ampliada</span></div>
      <div class="kpi"><b id="kStart">0</b><span>ações com início definido</span></div>
    </div>
    <div class="summary"><span><strong id="visible">0</strong> ações visíveis</span><span id="viewLabel">Organização por objetivo</span></div>
    <div id="sections" class="sections"></div>
  </div>
</main>
<script>
const FILE="Plano_Acao.xlsx";
const CATI=["ppi","credenciamento","credencia-mento","ct-info","lei tics"];
const OBJECTIVES=["Governança e Gestão","Ambiente Produtivo","Esforço Inovador","Inserção Global","Tecnologis Prioritárias","Tecnologias Prioritárias","Empresas Estratégicas","Aplicações Prioritárias"];
const COLORS={"Governança e Gestão":"#173A5E","Ambiente Produtivo":"#7D8892","Esforço Inovador":"#2B8E9E","Inserção Global":"#C28A32","Tecnologis Prioritárias":"#6B5B95","Tecnologias Prioritárias":"#6B5B95","Empresas Estratégicas":"#8C6D47","Aplicações Prioritárias":"#4F9B62"};
let actions=[],objOrder=[],scope="all",view="objective",groupLabel="Eixo";
const N=v=>String(v??"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim().toLowerCase().replace(/\s+/g," ");
const X=v=>N(v)==="x"; const TXT=v=>v==null||String(v).trim()===""?null:String(v).replace(/\r\n/g,"\n").replace(/\r/g,"\n").trim();
const E=v=>String(v??"—").replace(/[&<>\"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const uniq=a=>[...new Set(a.filter(Boolean))].sort((x,y)=>String(x).localeCompare(String(y),"pt-BR"));

async function load(){
 if(typeof XLSX==="undefined") throw Error("O componente de leitura do Excel não carregou. A rede pode estar bloqueando o CDN jsDelivr.");
 const res=await fetch(FILE+"?v="+Date.now(),{cache:"no-store"}); if(!res.ok) throw Error(FILE+" não encontrado.");
 const wb=XLSX.read(await res.arrayBuffer(),{type:"array"}), sn=wb.SheetNames.includes("Plano de Ação")?"Plano de Ação":wb.SheetNames[0];
 const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:null,raw:false,blankrows:false});
 let hr=rows.findIndex(r=>r.some(c=>N(c)==="acao")&&r.some(c=>N(c)==="#")); if(hr<0) throw Error('Cabeçalho "#" / "Ação" não encontrado.');
 const h=rows[hr].map(v=>String(v??"").trim()), hn=h.map(N), idx=(...a)=>{for(const x of a){let i=hn.indexOf(N(x));if(i>=0)return i}return -1};
 const I={id:idx("#"),action:idx("Ação"),origin:idx("Origem"),desc:idx("Descrição"),just:idx("Justificativas/Fundamentação"),challenge:idx("Principais Desafios para a Ação"),lead:idx("Líder Proposto"),participants:idx("Participantes"),axis:idx("Eixo"),type:idx("Tipo"),impact:idx("Impacto Direto nos objetivos"),maturity:idx("Maturidade"),start:idx("Início"),value:idx("Valor"),source:idx("Fonte"),cati:idx("CATI")};
 const oi=[];OBJECTIVES.forEach(o=>{let i=idx(o);if(i>=0&&!oi.includes(i))oi.push(i)});objOrder=oi.map(i=>h[i]);
 let ms=idx("P&D NS"," P&D NS"); if(ms<0&&oi.length)ms=Math.max(...oi)+1; let me=I.cati>=0?I.cati-1:h.length-1;
 const ii=[]; if(I.cati>=0)for(let i=I.cati+1;i<h.length;i++)if(h[i])ii.push(i);
 groupLabel=I.type>=0?"Tipo":"Eixo"; document.getElementById("byKind").textContent="Por "+groupLabel.toLowerCase(); document.querySelector("#kind option").textContent=groupLabel+": todos";
 const a=[];
 for(let r=hr+1;r<rows.length;r++){const row=rows[r],num=Number(String(row[I.id]??"").replace(",",".")),title=TXT(row[I.action]);if(!Number.isFinite(num)||!title)continue;
   const layers=oi.filter(i=>X(row[i])).map(i=>h[i]),metrics=[]; if(ms>=0)for(let i=ms;i<=me;i++)if(h[i]&&X(row[i]))metrics.push(h[i]);
   const instruments=ii.filter(i=>X(row[i])).map(i=>h[i]),cati=ii.some(i=>CATI.includes(N(h[i]))&&X(row[i]));
   a.push({id:"A"+String(Math.trunc(num)).padStart(2,"0"),n:num,action:title,origin:TXT(row[I.origin]),description:TXT(row[I.desc]),justification:TXT(row[I.just]),challenge:TXT(row[I.challenge]),lead:TXT(row[I.lead]),participants:TXT(row[I.participants]),axis:TXT(row[I.axis]),type:TXT(row[I.type])||TXT(row[I.axis])||"Sem classificação",impact:TXT(row[I.impact]),maturity:TXT(row[I.maturity]),start:TXT(row[I.start]),value:TXT(row[I.value]),source:TXT(row[I.source]),cati,scope:cati?"CATI":"Agenda ampliada",layers,metrics,instruments});
 }
 a.sort((x,y)=>x.n-y.n);actions=a;return sn;
}
function fill(sel,vals){while(sel.options.length>1)sel.remove(1);uniq(vals).forEach(v=>{let o=document.createElement("option");o.value=v;o.textContent=v;sel.appendChild(o)})}
function setup(){fill(impact,actions.map(a=>a.impact));fill(maturity,actions.map(a=>a.maturity));fill(lead,actions.map(a=>a.lead));fill(objectiveFilter,objOrder);fill(kind,actions.map(a=>a.type));let c=actions.filter(a=>a.cati).length,s=actions.filter(a=>a.start).length;[kTotal,nAll].forEach(x=>x.textContent=actions.length);[kCati,nCati].forEach(x=>x.textContent=c);[kBroad,nBroad].forEach(x=>x.textContent=actions.length-c);kStart.textContent=s}
function relevanceRank(a){
  const impactRank={"estruturante":5,"muito alto":4,"alto":3,"medio":2,"baixo":1};
  return impactRank[N(a.impact)] ?? 0;
}
function sortByRelevance(arr){
  return [...arr].sort((a,b)=>{
    const d=relevanceRank(b)-relevanceRank(a);
    if(d!==0)return d;
    return a.n-b.n;
  });
}
function vis(){let q=search.value.trim().toLocaleLowerCase("pt-BR");return sortByRelevance(actions.filter(a=>{let hay=[a.action,a.description,a.justification,a.challenge,a.lead,a.participants,a.origin,a.type,a.scope,...a.layers,...a.metrics,...a.instruments].filter(Boolean).join(" ").toLocaleLowerCase("pt-BR");return(scope==="all"||(scope==="cati"?a.cati:!a.cati))&&(!impact.value||a.impact===impact.value)&&(!maturity.value||a.maturity===maturity.value)&&(!lead.value||a.lead===lead.value)&&(!objectiveFilter.value||a.layers.includes(objectiveFilter.value))&&(!kind.value||a.type===kind.value)&&(!q||hay.includes(q))}))}
function chips(a,cls=""){return a&&a.length?'<div class="chips">'+a.map(x=>'<span class="chip '+cls+'">'+E(x)+'</span>').join("")+'</div>':"—"}
function card(a){let ic=N(a.impact)==="estruturante"?"struct":["alto","muito alto"].includes(N(a.impact))?"high":"";return '<article class="card '+(a.cati?"cati":"")+'"><div class="ctop"><span class="id">'+E(a.id)+'</span><div class="title">'+E(a.action)+'</div><span class="scopeTag '+(a.cati?"cati":"")+'">'+(a.cati?"CATI":"Agenda ampliada")+'</span></div><div class="meta"><span class="tag '+ic+'">'+E(a.impact||"—")+'</span><span class="tag">'+E(a.maturity||"—")+(a.start?" · "+E(a.start):"")+'</span><span class="tag">'+E(a.lead||"—")+'</span><span class="tag type">'+E(a.type)+'</span></div><div class="toggle"><span>Abrir detalhes</span><span>⌄</span></div><div class="detail"><div class="row"><b>Descrição.</b> '+E(a.description||"—")+'</div><div class="row"><b>Fundamentação.</b> '+E(a.justification||"—")+'</div><div class="row"><b>Desafio.</b> '+E(a.challenge||"—")+'</div><div class="row"><b>Participantes.</b> '+E(a.participants||"—")+'</div><div class="row"><b>Origem.</b> '+E(a.origin||"—")+'</div><div class="row"><b>Objetivos associados.</b> '+chips(a.layers,"obj")+'</div><div class="row"><b>Indicadores associados.</b> '+chips(a.metrics)+'</div><div class="row"><b>Instrumentos CATI.</b> '+chips(a.instruments)+'</div></div></article>'}
function wire(){document.querySelectorAll(".toggle").forEach(t=>t.onclick=()=>{let c=t.closest(".card");c.classList.toggle("open");t.firstElementChild.textContent=c.classList.contains("open")?"Recolher detalhes":"Abrir detalhes"})}
function render(){sections.innerHTML="";let set=vis();visible.textContent=set.length;viewLabel.textContent=view==="objective"?"Organização por objetivo":"Organização por "+groupLabel.toLowerCase();
 if(view==="objective"){objOrder.forEach(o=>{let arr=set.filter(a=>a.layers.includes(o)),s=document.createElement("section");s.className="section";s.style.borderTopColor=COLORS[o]||"#2C6EAA";s.innerHTML='<h2><span>'+E(o)+'</span><span class="count">'+arr.length+' '+(arr.length===1?"ação":"ações")+'</span></h2><div class="groups"></div>';let g=s.querySelector(".groups");if(!arr.length)g.innerHTML='<div class="empty">Nenhuma ação com os filtros atuais.</div>';else{let m=new Map;arr.forEach(a=>{if(!m.has(a.type))m.set(a.type,[]);m.get(a.type).push(a)});[...m].sort((x,y)=>x[0].localeCompare(y[0],"pt-BR")).forEach(([k,l])=>{let d=document.createElement("div");d.className="group";d.innerHTML='<div class="ghead"><strong>'+E(k)+'</strong><span>'+l.length+' '+(l.length===1?"ação":"ações")+'</span></div><div class="cards">'+l.map(card).join("")+'</div>';g.appendChild(d)})}sections.appendChild(s)})}
 else{let m=new Map;sortByRelevance(set).forEach(a=>{if(!m.has(a.type))m.set(a.type,[]);m.get(a.type).push(a)});[...m].sort((x,y)=>x[0].localeCompare(y[0],"pt-BR")).forEach(([k,l])=>{let s=document.createElement("section");s.className="section";s.innerHTML='<h2><span>'+E(k)+'</span><span class="count">'+l.length+' '+(l.length===1?"ação":"ações")+'</span></h2><div class="groups"><div class="group"><div class="cards">'+l.map(card).join("")+'</div></div></div>';sections.appendChild(s)})}
 wire();
}
document.querySelectorAll(".pill").forEach(b=>b.onclick=()=>{scope=b.dataset.scope;document.querySelectorAll(".pill").forEach(x=>x.classList.toggle("active",x===b));render()});
[search,impact,maturity,lead,objectiveFilter,kind].forEach(x=>x.oninput=render);
byObjective.onclick=()=>{view="objective";byObjective.classList.add("active");byKind.classList.remove("active");render()};byKind.onclick=()=>{view="kind";byKind.classList.add("active");byObjective.classList.remove("active");render()};
clear.onclick=()=>{search.value=impact.value=maturity.value=lead.value=objectiveFilter.value=kind.value="";scope="all";document.querySelectorAll(".pill").forEach(x=>x.classList.toggle("active",x.dataset.scope==="all"));render()};
expand.onclick=()=>document.querySelectorAll(".card").forEach(c=>{c.classList.add("open");c.querySelector(".toggle span").textContent="Recolher detalhes"});
collapse.onclick=()=>document.querySelectorAll(".card").forEach(c=>{c.classList.remove("open");c.querySelector(".toggle span").textContent="Abrir detalhes"});
mobileFilters.onclick=()=>toolbar.classList.toggle("open");
(async()=>{
  const statusBox=document.getElementById("status");
  const appBox=document.getElementById("app");
  const baseNoteBox=document.getElementById("baseNote");
  try{
    await load();
    if(!actions.length)throw Error("Nenhuma ação válida encontrada.");
    setup();
    baseNoteBox.textContent="Base: "+FILE+" · "+actions.length+" ações carregadas";
    statusBox.remove();
    appBox.hidden=false;
    render();
  }catch(e){
    console.error(e);
    statusBox.className="fatal";
    statusBox.innerHTML="<strong>Não foi possível carregar a base.</strong><br><br>"+E(e.message)+"<br><br>Confira se <strong>"+FILE+"</strong> está na mesma pasta do <strong>index.html</strong> e se os dois arquivos foram publicados juntos no Netlify.";
    baseNoteBox.textContent="Base indisponível.";
  }
})();
</script>
</body></html>
